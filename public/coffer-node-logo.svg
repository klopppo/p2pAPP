<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" fill="none">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C58E"/>
      <stop offset="100%" stop-color="#0A9E76"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A3D3F"/>
      <stop offset="100%" stop-color="#072E30"/>
    </linearGradient>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- === ICON: vault formed by network nodes === -->
  <g transform="translate(10, 15)" filter="url(#nodeGlow)">

    <!-- Outer hexagonal coffer shell -->
    <polygon points="32,0 58,14 58,42 32,56 6,42 6,14"
             stroke="#0A3D3F" stroke-width="2" fill="none"/>
    <polygon points="32,0 58,14 58,42 32,56 6,42 6,14"
             stroke="#00C58E" stroke-width="0.6" fill="none" opacity="0.25"/>

    <!-- Inner vault door hexagon -->
    <polygon points="32,12 46,20 46,36 32,44 18,36 18,20"
             stroke="#0A3D3F" stroke-width="1.8" fill="#0A3D3F" fill-opacity="0.15"/>
    <polygon points="32,12 46,20 46,36 32,44 18,36 18,20"
             stroke="#00C58E" stroke-width="0.5" fill="none" opacity="0.3"/>

    <!-- Lock body -->
    <rect x="29" y="24" width="6" height="8" rx="1.5" fill="url(#green)"/>
    <!-- Lock shackle -->
    <path d="M30 24 V21 a2 2 0 0 1 4 0 V24" stroke="#00C58E" stroke-width="1.5" fill="none"/>

    <!-- Outer network nodes -->
    <circle cx="32" cy="0" r="3.5" fill="#00C58E"/>
    <circle cx="58" cy="14" r="3" fill="#00C58E" opacity="0.85"/>
    <circle cx="58" cy="42" r="3" fill="#00C58E" opacity="0.85"/>
    <circle cx="32" cy="56" r="3.5" fill="#00C58E"/>
    <circle cx="6" cy="42" r="3" fill="#00C58E" opacity="0.85"/>
    <circle cx="6" cy="14" r="3" fill="#00C58E" opacity="0.85"/>

    <!-- Inner network nodes -->
    <circle cx="32" cy="12" r="2" fill="#E6F5F3" opacity="0.7"/>
    <circle cx="46" cy="20" r="1.5" fill="#E6F5F3" opacity="0.5"/>
    <circle cx="46" cy="36" r="1.5" fill="#E6F5F3" opacity="0.5"/>
    <circle cx="32" cy="44" r="2" fill="#E6F5F3" opacity="0.7"/>
    <circle cx="18" cy="36" r="1.5" fill="#E6F5F3" opacity="0.5"/>
    <circle cx="18" cy="20" r="1.5" fill="#E6F5F3" opacity="0.5"/>

    <!-- Network connection lines -->
    <line x1="32" y1="0" x2="58" y2="14" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="58" y1="14" x2="58" y2="42" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="58" y1="42" x2="32" y2="56" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="32" y1="56" x2="6" y2="42" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="6" y1="42" x2="6" y2="14" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="6" y1="14" x2="32" y2="0" stroke="#0A3D3F" stroke-width="0.8"/>

    <!-- Inner-to-outer connection lines -->
    <line x1="32" y1="0" x2="32" y2="12" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="58" y1="14" x2="46" y2="20" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="58" y1="42" x2="46" y2="36" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="32" y1="56" x2="32" y2="44" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="6" y1="42" x2="18" y2="36" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="6" y1="14" x2="18" y2="20" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
  </g>

  <!-- === WORDMARK === -->
  <text x="86" y="56" font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-size="36" font-weight="700" letter-spacing="-1"
        fill="#E6F5F3">Coffer<tspan fill="#00C58E">Node</tspan></text>

  <!-- Tagline -->
  <text x="86" y="76" font-family="'Inter', system-ui, -apple-system, sans-serif"
        font-size="9.5" font-weight="500" letter-spacing="3"
        fill="#0A3D3F">PEER-TO-PEER EXCHANGE</text>
</svg>
