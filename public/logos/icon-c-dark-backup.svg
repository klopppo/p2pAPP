<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- C mark — clean geometric -->
  <path
    d="M44 16C36 16 28 22 24 32C20 42 24 50 32 54"
    stroke="#F8FAFC"
    stroke-width="5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Cat Eye — subtle pupil inside C -->
  <circle cx="32" cy="36" r="5" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="32" cy="36" r="8" fill="#F8FAFC" opacity="0.2"/>

  <!-- P2P Nodes — three dots above -->
  <circle cx="32" cy="8" r="2.5" fill="#F8FAFC"/>
  <circle cx="22" cy="12" r="2" fill="#F8FAFC" opacity="0.6"/>
  <circle cx="42" cy="12" r="2" fill="#F8FAFC" opacity="0.6"/>

  <!-- Node connections — thin lines -->
  <line x1="32" y1="8" x2="22" y2="12" stroke="#F8FAFC" stroke-width="0.8" opacity="0.4"/>
  <line x1="32" y1="8" x2="42" y2="12" stroke="#F8FAFC" stroke-width="0.8" opacity="0.4"/>
  <line x1="22" y1="12" x2="42" y2="12" stroke="#F8FAFC" stroke-width="0.8" opacity="0.4"/>
</svg>
