<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- CofferNode CN Mark — abs-2: Circle-CN -->
  <!-- Large circle = C frame, gap opens right = C, N bars live inside the ring -->
  <rect width="100" height="100" rx="18" fill="#0B0F12"/>
  <!-- C outer ring -->
  <circle cx="50" cy="50" r="34" fill="#FFFFFF"/>
  <!-- C inner (creates ring) -->
  <circle cx="50" cy="50" r="22" fill="#0B0F12"/>
  <!-- C gap (opens the ring on the right) -->
  <rect x="70" y="28" width="16" height="44" fill="#0B0F12"/>
  <!-- N left vertical (inside the C ring) -->
  <rect x="36" y="36" width="4" height="28" rx="1" fill="#FFFFFF"/>
  <!-- N right vertical -->
  <rect x="52" y="36" width="4" height="28" rx="1" fill="#FFFFFF"/>
  <!-- N diagonal -->
  <path d="M40 36 L56 64" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
</svg>
