<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- CofferNode CN Mark — abs-4: Chevron-CN -->
  <!-- C: thick angular crescent (bold stroke) -->
  <!-- N: bold verticals + diagonal, slightly overlapping the C -->
  <rect width="100" height="100" rx="18" fill="#0B0F12"/>
  <!-- C: bold crescent arc -->
  <path d="M54 14 A36 36 0 1 0 54 86 A24 24 0 1 1 54 14 Z" fill="#FFFFFF"/>
  <!-- N left vertical -->
  <rect x="58" y="18" width="6" height="64" rx="2" fill="#FFFFFF"/>
  <!-- N right vertical -->
  <rect x="80" y="18" width="6" height="64" rx="2" fill="#FFFFFF"/>
  <!-- N diagonal -->
  <path d="M64 18 L86 82" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
</svg>
