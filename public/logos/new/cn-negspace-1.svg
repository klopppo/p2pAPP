<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Minimal negative-space mark 1: two interlocking blocks create a central keyhole/vault  -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  <g fill="#000000">
    <rect x="10" y="20" width="28" height="60" rx="6"/>
    <rect x="62" y="20" width="28" height="60" rx="6"/>
    <!-- top bridging bar: when removed, leaves negative keyhole -->
    <rect x="28" y="20" width="44" height="18" rx="4" fill="#FFFFFF"/>
    <!-- center notch to form vault opening -->
    <rect x="42" y="38" width="16" height="30" rx="4" fill="#FFFFFF"/>
  </g>
</svg>