<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00FF87"/>
    </linearGradient>
  </defs>
  <!-- Background subtle rounded -->
  <rect width="64" height="64" rx="12" fill="#FBFEFF"/>
  <!-- Cup / vault (open at top) -->
  <path d="M12 30c0-6 6-10 20-10s20 4 20 10v8c0 6-6 10-20 10S12 44 12 38v-8z" fill="none" stroke="url(#g1)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Liquid surface (wavy) -->
  <path d="M14 34c4-2 8-2 12-2s8 0 12 2" fill="none" stroke="#0F172A" stroke-opacity="0.06" stroke-width="2" stroke-linecap="round"/>
  <!-- Cat eye as guardian inside liquid -->
  <ellipse cx="32" cy="36" rx="6" ry="3.6" fill="#0F172A" opacity="0.95"/>
  <ellipse cx="32" cy="36" rx="2" ry="1.2" fill="#C8F31E"/>
  <!-- Three orbital P2P nodes -->
  <circle cx="20" cy="12" r="2.2" fill="#00B8D9"/>
  <circle cx="32" cy="8" r="2.2" fill="#C8F31E"/>
  <circle cx="44" cy="12" r="2.2" fill="#00A676"/>
  <!-- orbital arcs -->
  <path d="M22 14 C28 6,36 6,46 14" fill="none" stroke="#00B8D9" stroke-opacity="0.22" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M18 14 C26 4,38 4,46 14" fill="none" stroke="#00A676" stroke-opacity="0.14" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Subtle base line -->
  <path d="M10 46h44" stroke="#0F172A" stroke-opacity="0.06" stroke-width="2" stroke-linecap="round"/>
</svg>
