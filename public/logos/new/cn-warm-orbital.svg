<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- CofferNode — The Orbital Hub: central vault with two orbiting node cutouts -->
  <rect width="100" height="100" rx="16" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="28" fill="#2C2522"/>
  <!-- Orbital node cutouts — peers circling the vault -->
  <circle cx="34" cy="42" r="8" fill="#FFFFFF"/>
  <circle cx="66" cy="58" r="8" fill="#FFFFFF"/>
  <!-- Center node — the core connection point -->
  <circle cx="50" cy="50" r="4" fill="#FFFFFF"/>
</svg>
