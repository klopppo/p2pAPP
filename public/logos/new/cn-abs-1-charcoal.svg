<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- CofferNode CN Mark — abs-1: Classic Monogram -->
  <!-- C: thick arc (circle minus inner circle minus right gap) -->
  <!-- N: two verticals + diagonal, sharing the C's opening edge -->
  <rect width="100" height="100" rx="18" fill="#0B0F12"/>
  <!-- C outer -->
  <circle cx="36" cy="50" r="30" fill="#FFFFFF"/>
  <!-- C inner (ring thickness) -->
  <circle cx="36" cy="50" r="18" fill="#0B0F12"/>
  <!-- C gap (opens the ring on the right) -->
  <rect x="48" y="32" width="16" height="36" fill="#0B0F12"/>
  <!-- N left vertical (at the C opening edge) -->
  <rect x="54" y="20" width="5" height="60" rx="1" fill="#FFFFFF"/>
  <!-- N right vertical -->
  <rect x="78" y="20" width="5" height="60" rx="1" fill="#FFFFFF"/>
  <!-- N diagonal -->
  <path d="M59 20 L83 80" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
</svg>
