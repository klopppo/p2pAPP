<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- Minimal negative-space mark 3: circle with precise rectangular cuts forming a 'vault' negative center -->
  <rect width="100" height="100" fill="#FFFFFF"/>
  <g fill="#000000">
    <circle cx="50" cy="44" r="34"/>
    <!-- horizontal slot cut -->
    <rect x="30" y="40" width="40" height="12" rx="2" fill="#FFFFFF"/>
    <!-- vertical bar cut creates C-like negative space -->
    <rect x="46" y="30" width="8" height="36" rx="2" fill="#FFFFFF"/>
  </g>
</svg>