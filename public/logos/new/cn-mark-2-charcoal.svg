<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <rect width="100" height="100" fill="#FFFFFF"/>
  <!-- Mark 2: two interlocked rings + connector node, creates C-like and diagonal N negative shapes -->
  <g fill="#2C2522">
    <circle cx="36" cy="44" r="22"/>
    <circle cx="64" cy="44" r="22"/>
    <!-- connector node (solid) -->
    <circle cx="64" cy="20" r="4"/>
  </g>
  <!-- remove small overlaps via white cutouts for crisp negative forms -->
  <g fill="#FFFFFF">
    <circle cx="50" cy="44" r="10"/>
  </g>
</svg>