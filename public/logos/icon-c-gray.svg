<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g" x1="12" y1="8" x2="52" y2="56">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- C mark — clean geometric -->
  <path
    d="M44 16C36 16 28 22 24 32C20 42 24 50 32 54"
    stroke="url(#g)"
    stroke-width="5"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Cat Eye — subtle pupil inside C -->
  <circle cx="32" cy="36" r="5" fill="url(#eye)"/>
  <circle cx="32" cy="36" r="8" fill="url(#glow)"/>

  <!-- P2P Nodes — three dots above -->
  <circle cx="32" cy="8" r="2.5" fill="#94A3B8"/>
  <circle cx="22" cy="12" r="2" fill="#94A3B8" opacity="0.6"/>
  <circle cx="42" cy="12" r="2" fill="#94A3B8" opacity="0.6"/>

  <!-- Node connections — thin lines -->
  <line x1="32" y1="8" x2="22" y2="12" stroke="#94A3B8" stroke-width="0.8" opacity="0.4"/>
  <line x1="32" y1="8" x2="42" y2="12" stroke="#94A3B8" stroke-width="0.8" opacity="0.4"/>
  <line x1="22" y1="12" x2="42" y2="12" stroke="#94A3B8" stroke-width="0.8" opacity="0.4"/>
</svg>
