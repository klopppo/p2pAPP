      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- C mark — centered, large -->
  <g transform="translate(420, 100) scale(8)">
    <path
      d="M44 16C36 16 28 22 24 32C20 42 24 50 32 54"
      stroke="url(#g)"
      stroke-width="5"
      stroke-linecap="round"
      fill="none"
    />
    <circle cx="32" cy="36" r="5" fill="url(#eye)"/>
    <circle cx="32" cy="36" r="8" fill="url(#glow)"/>
    <circle cx="32" cy="8" r="2.5" fill="#94A3B8"/>
    <circle cx="22" cy="12" r="2" fill="#94A3B8" opacity="0.6"/>
    <circle cx="42" cy="12" r="2" fill="#94A3B8" opacity="0.6"/>
    <line x1="32" y1="8" x2="22" y2="12" stroke="#94A3B8" stroke-width="0.8" opacity="0.4"/>
    <line x1="32" y1="8" x2="42" y2="12" stroke="#94A3B8" stroke-width="0.8" opacity="0.4"/>
    <line x1="22" y1="12" x2="42" y2="12" stroke="#94A3B8" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Brand Name -->
  <text
    x="600" y="540"
    text-anchor="middle"
    font-family="Inter,system-ui,-apple-system,sans-serif"
    font-size="72"
    font-weight="800"
