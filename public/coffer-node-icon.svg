<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00C58E"/>
      <stop offset="100%" stop-color="#0A9E76"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Outer hexagonal coffer shell -->
    <polygon points="32,2 58,15 58,43 32,56 6,43 6,15"
             stroke="#0A3D3F" stroke-width="2" fill="none"/>
    <polygon points="32,2 58,15 58,43 32,56 6,43 6,15"
             stroke="#00C58E" stroke-width="0.6" fill="none" opacity="0.25"/>

    <!-- Inner vault door -->
    <polygon points="32,13 46,21 46,37 32,45 18,37 18,21"
             stroke="#0A3D3F" stroke-width="1.8" fill="#0A3D3F" fill-opacity="0.15"/>
    <polygon points="32,13 46,21 46,37 32,45 18,37 18,21"
             stroke="#00C58E" stroke-width="0.5" fill="none" opacity="0.3"/>

    <!-- Lock body -->
    <rect x="29" y="25" width="6" height="8" rx="1.5" fill="url(#green)"/>
    <!-- Lock shackle -->
    <path d="M30 25 V22 a2 2 0 0 1 4 0 V25" stroke="#00C58E" stroke-width="1.5" fill="none"/>

    <!-- Outer nodes -->
    <circle cx="32" cy="2" r="3.5" fill="#00C58E"/>
    <circle cx="58" cy="15" r="3" fill="#00C58E" opacity="0.85"/>
    <circle cx="58" cy="43" r="3" fill="#00C58E" opacity="0.85"/>
    <circle cx="32" cy="56" r="3.5" fill="#00C58E"/>
    <circle cx="6" cy="43" r="3" fill="#00C58E" opacity="0.85"/>
    <circle cx="6" cy="15" r="3" fill="#00C58E" opacity="0.85"/>

    <!-- Inner nodes -->
    <circle cx="32" cy="13" r="2" fill="#E6F5F3" opacity="0.7"/>
    <circle cx="46" cy="21" r="1.5" fill="#E6F5F3" opacity="0.5"/>
    <circle cx="46" cy="37" r="1.5" fill="#E6F5F3" opacity="0.5"/>
    <circle cx="32" cy="45" r="2" fill="#E6F5F3" opacity="0.7"/>
    <circle cx="18" cy="37" r="1.5" fill="#E6F5F3" opacity="0.5"/>
    <circle cx="18" cy="21" r="1.5" fill="#E6F5F3" opacity="0.5"/>

    <!-- Outer edges -->
    <line x1="32" y1="2" x2="58" y2="15" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="58" y1="15" x2="58" y2="43" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="58" y1="43" x2="32" y2="56" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="32" y1="56" x2="6" y2="43" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="6" y1="43" x2="6" y2="15" stroke="#0A3D3F" stroke-width="0.8"/>
    <line x1="6" y1="15" x2="32" y2="2" stroke="#0A3D3F" stroke-width="0.8"/>

    <!-- Inner-to-outer links -->
    <line x1="32" y1="2" x2="32" y2="13" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="58" y1="15" x2="46" y2="21" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="58" y1="43" x2="46" y2="37" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="32" y1="56" x2="32" y2="45" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="6" y1="43" x2="18" y2="37" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
    <line x1="6" y1="15" x2="18" y2="21" stroke="#00C58E" stroke-width="0.4" opacity="0.35"/>
  </g>
</svg>
